<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة جدول الضرب</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Welcome overlay professional main menu -->
    <div id="welcomeOverlay" aria-hidden="false">
        <div class="welcome-card" role="dialog" aria-label="مرحباً">
            <div class="company-name">Tunisie Plumes _ Jardin du savoir</div>
            <div class="welcome-title">مرحباً بكم في لعبة جدول الضرب</div>
            <div class="welcome-sub">Tunisie Plumes _ Jardin du savoir — مكتبة.</div>
            
            <div class="carousel-section">
                <div class="carousel-title">معرض الصور</div>
                <div class="carousel-viewport" id="carouselViewport">
                    <div class="carousel-track" id="carouselTrack">
                        <!-- Items populated dynamically -->
                    </div>
                </div>
            </div>

            <div class="welcome-actions">
                <button id="voirPlusBtn" class="btn-ghost">عرض المزيد</button>
                <button id="startGameBtn" class="btn-primary">بدء اللعبة</button>
            </div>

            <div class="contact-details" id="contactDetails">

                    <div>العنوان: Av. Mohamed Hédi Khefacha, Dar Chaabane Al Fehri</div>
                </div>
                <div class="contact-row">
                    <svg viewBox="0 0 24 24" fill="none"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z" stroke="#0b3a8a" stroke-width="1.5"/></svg>
                    <div>الهاتف والواتساب: <a href="tel:99680408">99680408</a></div>
                </div>
                <div class="contact-row social-row">
                    <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" stroke="#0b3a8a" stroke-width="1.5"/><path d="M8 12h8" stroke="#0b3a8a" stroke-width="1.5"/></svg>
                    <span>مواقع التواصل:</span>
                    <div class="social-icons">
                        <a href="https://facebook.com" target="_blank" aria-label="Facebook" class="social-icon facebook">
                            <svg viewBox="0 0 24 24" fill="currentColor">
                                <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
                            </svg>
                        </a>
                        <a href="https://instagram.com" target="_blank" aria-label="Instagram" class="social-icon instagram">
                            <svg viewBox="0 0 24 24" fill="currentColor">
                                <path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/>
                            </svg>
                        </a>
                        <a href="https://tiktok.com" target="_blank" aria-label="TikTok" class="social-icon tiktok">

                                <path d="M12.525.02c1.31-.02 2.61-.01 3.91-.02.08 1.53.63 3.09 1.75 4.17 1.12 1.11 2.7 1.62 4.24 1.79v4.03c-1.44-.05-2.89-.35-4.2-.97-.57-.26-1.1-.59-1.62-.98-.01 2.92.01 5.84-.02 8.75-.08 1.4-.54 2.79-1.35 3.94-1.31 1.92-3.58 3.17-5.91 3.21-1.43.08-2.86-.31-4.08-1.03-2.02-1.19-3.44-3.37-3.65-5.71-.02-.5-.03-1-.01-1.49.18-1.9 1.12-3.72 2.58-4.96 1.66-1.44 3.98-2.13 6.15-1.72.02 1.48-.04 2.96-.04 4.44-.99-.32-2.15-.23-3.02.37-.82.57-1.34 1.55-1.37 2.55-.06 1.34.72 2.63 1.87 3.2 1.05.53 2.37.45 3.32-.23.86-.61 1.39-1.64 1.41-2.7.04-4.87.01-9.74.02-14.61z"/>
                            </svg>
                        </a>
                    </div>
                </div>
                <div class="map-embed">
                    <iframe width="100%" height="100%" frameborder="0" style="border:0" src="https://www.google.com/maps?q=Tunisie+Plumes+Jardin+du+savoir,+Av.+Mohamed+H%C3%A9di+Khefacha,+Dar+Chaabane+Al+Fehri&z=17&output=embed" allowfullscreen="" aria-hidden="false"></iframe>
                </div>
            </div>
        </div>
    </div>
    <div id="imageModal" class="image-modal" aria-hidden="true">
        <div class="image-modal-content">
            <button type="button" class="image-modal-close" aria-label="إغلاق الصورة">×</button>
            <img src="" alt="تكبير الصورة" id="modalImage" />
        </div>
    </div>
    <div class="top-controls">
        <button id="themeToggle" class="option-btn secondary" onclick="toggleTheme()" aria-label="تبديل المظهر">🌙</button>
        <button id="soundToggle" class="option-btn secondary" onclick="toggleSound()" aria-label="تفعيل/إيقاف الصوت">🔊</button>
        <button id="musicToggle" class="option-btn secondary" onclick="toggleMusic()" aria-label="تفعيل/إيقاف الموسيقى">⏹️</button>
        <button id="switchMusicBtn" class="option-btn secondary" onclick="switchMusicTrack()">1</button>
    </div>
    <div class="container">
        <h1>لعبة جدول الضرب</h1>
        <div id="mainMenu">
            <h2>اختر رقمًا</h2>
            <div class="number-grid" id="numberGrid"></div>
            <button id="showErrorsBtn">عرض الأخطاء السابقة <span id="errorsBadge"></span></button>
        </div>
        <div id="optionsMenu" style="display: none;">
            <h2 id="selectedNumber"></h2>
            <button class="option-btn secondary" onclick="showTable()">مشاهدة الجدول</button>
            <button class="option-btn easy" onclick="startQuiz('easy')">سلسلة سهلة</button>
            <button class="option-btn hard" onclick="startQuiz('hard')">سلسلة صعبة</button>
            <button class="option-btn secondary" onclick="backToMain()">رجوع</button>
        </div>
        <div id="tableView" style="display: none;">
            <h2 id="tableTitle"></h2>
            <div id="tableContent"></div>
            <button class="option-btn secondary" onclick="backToOptions()">رجوع</button>
        </div>
        <div id="quizView" style="display: none;">
            <h2 id="quizTitle"></h2>
            <div id="completedOperations"></div>
            <div class="question" id="question"></div>
            <div id="answers"></div>
            <div class="feedback" id="feedback"></div>
            <button id="backFromQuizBtn" class="option-btn secondary" onclick="backToOptions()">رجوع</button>
        </div>
        <div id="resultView" style="display: none;">
            <h2>نتيجة الاختبار</h2>
            <div id="resultSummary"></div>
            <div id="mistakes"></div>
            <div id="allOperations"></div>
            <button class="option-btn secondary" onclick="backToOptions()">رجوع</button>
        </div>
        <div id="errorsView" style="display: none;">
            <h2>الأخطاء السابقة</h2>
            <div id="errorsList"></div>
            <button class="option-btn secondary" onclick="backToMain()">رجوع</button>
        </div>
    </div>
    <audio id="bgMusic1" playsinline loop preload="auto">
        <source src="music1.mp3" type="audio/mpeg">
    </audio>
    <audio id="bgMusic2" playsinline loop preload="auto">
        <source src="music2.mp3" type="audio/mpeg">
    </audio>
    <audio id="bgMusic3" playsinline loop preload="auto">
        <source src="music3.mp3" type="audio/mpeg">
    </audio>
    <audio id="bgMusic4" playsinline loop preload="auto">
        <source src="music4.mp3" type="audio/mpeg">
    </audio>
    <audio id="bgMusic5" playsinline loop preload="auto">
        <source src="music5.mp3" type="audio/mpeg">
    </audio>
    <audio id="celebrationAudio" playsinline preload="auto">
        <source src="Celebration.mp3" type="audio/mpeg">
    </audio>
    <audio id="vraiAudio" playsinline preload="auto">
        <source src="vrai.mp3" type="audio/mpeg">
    </audio>
    <audio id="fauxAudio" playsinline preload="auto">
        <source src="faux.mp3" type="audio/mpeg">
    </audio>
    <script src="game.js" defer></script>
</body>
</html>
